name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Dependency vulnerability scan
  # Runs pip-audit against requirements.txt and fails the build if any known
  # CVEs are found with a fix available. Keeps the supply chain clean.
  # ---------------------------------------------------------------------------
  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run vulnerability scan
        run: pip-audit -r requirements.txt --strict
        # --strict: exit non-zero if any vulnerability is found
        # Remove --strict and add --ignore-vuln GHSA-xxxx to suppress false positives

  # ---------------------------------------------------------------------------
  # Job 2 — Lint
  # Catches syntax errors and obvious bugs before tests even run.
  # Ruff is used — it replaces flake8, isort, and pyupgrade in one fast tool.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check app/ tests/
        # Fails on any lint error — add `# noqa: EXXX` inline to suppress specific rules

  # ---------------------------------------------------------------------------
  # Job 3 — Tests
  # Runs the full pytest suite against in-memory SQLite (no Neon, no Redis
  # needed — conftest.py already handles the override). Celery tasks are
  # not invoked in tests (tasks are called via .delay() which requires a
  # broker — mock them out with CELERY_TASK_ALWAYS_EAGER if needed).
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint]  # Only run tests if lint passes

    env:
      # All secrets injected from GitHub repo Settings → Secrets
      APP_ENV: test
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: sqlite:///:memory:
      REDIS_URL: ""                          # Not needed for unit tests
      AI_CLASSIFIER_API_KEY: ""             # Tests mock the external call
      ALLOWED_ORIGINS: "http://localhost:8000"
      VERIFICATION_THRESHOLD: "2"
      RATE_LIMIT_LOGIN_MAX: "100"           # Relaxed in CI — all tests share one IP
      RATE_LIMIT_MAX_REQUESTS: "1000"
      RATE_LIMIT_ISSUE_MAX: "100"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          pytest tests/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=60
        # --cov-fail-under=60: fail if coverage drops below 60%
        # Raise this threshold as more tests are added

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 4 — Security headers check
  # Spins up the app briefly and verifies that all required security headers
  # are present in HTTP responses. Catches regressions if someone accidentally
  # removes the middleware.
  # ---------------------------------------------------------------------------
  security-headers:
    name: Security headers check
    runs-on: ubuntu-latest
    needs: [test]

    env:
      APP_ENV: test
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: sqlite:///./ci_test.db
      REDIS_URL: ""
      AI_CLASSIFIER_API_KEY: ""
      ALLOWED_ORIGINS: "http://localhost:5000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start server in background
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 5000 &
          sleep 3  # Give uvicorn time to start

      - name: Check security headers
        run: python .github/scripts/check_headers.py
